name: macOS Cloud Desktop (VNC + Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 1. Setup User and VNC for TightVNC Support
        run: |
          # ۱. تنظیم رمز عبور سیستم برای کاربر runner
          sudo sysadminctl -adminUser runner -adminPassword "" -resetPasswordFor runner -newPassword "P@ssw0rd1qazXSW@#"

          # ۲. فعال‌سازی رمزنگاری قدیمی (Legacy VNC) و تنظیم رمز اختصاصی برای TightVNC
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy yes -setvncpw -vncpw "P@ssw0rd1qazXSW@#" \
            -restart -agent -privs -all

          echo "✅ VNC configured with Legacy Security support."

      - name: 2. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # نصب Tailscale با Homebrew
          brew install tailscale
          
          # اجرای دمون Tailscale در پس‌زمینه
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5
          
          # اتصال به شبکه Tailscale
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="github-mac-$RANDOM" --accept-routes
          
          # دریافت آدرس IP اختصاصی
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "==========================================================" 
          echo "  >>> 🍎 macOS CLOUD DESKTOP IS READY! <<<" 
          echo "  🌐 Tailscale IP : $TS_IP" 
          echo "  👤 Username     : runner" 
          echo "  🔑 Password     : P@ssw0rd1qazXSW@#" 
          echo "----------------------------------------------------------"
          echo "  🖥️ VNC / Screen Sharing Address : $TS_IP:5900"
          echo "==========================================================" 

      - name: 3. Keep Server Alive (Max 350 mins)
        run: |
          # حلقه زنده نگه داشتن سیستم
          for ((i=1; i<=350; i++)); do
            sleep 60
            echo "⏳ [$i/350] macOS runner active..."
          done
